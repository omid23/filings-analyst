[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "filings-analyst"
version = "0.1.0"
description = "Agentic RAG over SEC filings with cited, number-checked answers, an MCP server and FinanceBench evals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omid" }]
dependencies = [
  "pymupdf>=1.24",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "starlette>=0.37",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.4"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
filings-analyst = "filings_analyst.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_analyst"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
